name: App Alianzas - Vencimiento de Solicitudes
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

jobs:
  check-calendar:
    uses: ./.github/workflows/logicaCalendario.yaml
  
  execute:
    needs: check-calendar
    if: needs.check-calendar.outputs.run_daily == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # Caching Pip dependencies to speed up future runs
      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Ejecución de Vencimiento de Solicitudes
        env:
          MI_JSON: ${{ secrets.MI_JSON }}
        run: jupyter nbconvert --to notebook --execute automations/Vencimiento_Automatico_Solicitudes.ipynb --inplace
